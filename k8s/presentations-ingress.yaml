apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talks-n8n-ingress
  annotations:
    # TLS handled by Cloudflare; serve plain HTTP internally.
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    traefik.ingress.kubernetes.io/router.middlewares: "default-redirect-to-talks-n8n@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: n8n.catshoulder.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: talks-service
                port:
                  number: 8080
---
