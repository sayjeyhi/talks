apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talks-ingress
  annotations:
    # TLS is terminated by Cloudflare at the edge; Traefik serves plain HTTP
    # inside the cluster, reached via the cloudflared tunnel.
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: traefik
  rules:
    - host: 'talks.catshoulder.dev'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: talks-service
                port:
                  number: 8080
